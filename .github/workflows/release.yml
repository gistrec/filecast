name: Release

# workflow_dispatch runs only the build matrix (a smoke test of the build
# configuration). The release and winget jobs fire solely on a v* tag push, so
# a manual dispatch, even one aimed at an existing tag, cannot rebuild and
# overwrite already-published assets, whose SHA-256 the winget manifest and
# the homebrew tap pin. (A "Re-run all jobs" on a finished tag push is not
# blocked by this condition; do not re-run a green release.)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Every job gets a read-only GITHUB_TOKEN unless it asks for more (release does).
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # Linux builds run inside Debian 11 (glibc 2.31), so the binaries work on
    # Ubuntu 20.04+/Debian 11+ regardless of which Ubuntu version the runner
    # label points at; libstdc++/libgcc are linked statically for the same
    # reason. Debian 11 LTS ended 2026-08-31 and its security pool vanished
    # from deb.debian.org, so a current debian:bullseye image (shipped with
    # those security versions preinstalled) can no longer install a matching
    # libc6-dev. Hence the image is pinned to the last build before the 11.11
    # point release and apt is pointed at the permanent archive.debian.org
    # mirror, which is exactly 11.11; only a build toolchain is installed.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: debian:bullseye-20240812
            artifact_name: filecast
            asset_name: filecast-linux-x86_64
          - os: ubuntu-24.04-arm
            container: debian:bullseye-20240812
            artifact_name: filecast
            asset_name: filecast-linux-arm64
          # One universal binary covers Apple Silicon and Intel Macs.
          - os: macos-latest
            artifact_name: filecast
            asset_name: filecast-macos-universal
          - os: windows-latest
            artifact_name: filecast.exe
            asset_name: filecast-windows-x86_64.exe

    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}

    steps:
      - name: Install build tools (Linux container)
        if: runner.os == 'Linux'
        run: |
          echo 'deb http://archive.debian.org/debian bullseye main' > /etc/apt/sources.list
          apt-get update
          apt-get install -y --no-install-recommends g++ cmake make git ca-certificates

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      - name: Configure
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -S . -B build -G Ninja \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DBUILD_TESTING=OFF \
                  -DFILECAST_VERSION="${VERSION}" \
                  -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # Without an explicit deployment target the binary refuses to run
            # on any macOS older than the runner's own version.
            cmake -S . -B build \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DBUILD_TESTING=OFF \
                  -DFILECAST_VERSION="${VERSION}" \
                  -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                  -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          else
            cmake -S . -B build \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DBUILD_TESTING=OFF \
                  -DFILECAST_VERSION="${VERSION}" \
                  -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"
          fi

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke-test the binary
        run: |
          ./build/${{ matrix.artifact_name }} --version
          if [ "$RUNNER_OS" == "macOS" ]; then
            lipo -archs build/${{ matrix.artifact_name }} | grep -q x86_64
            lipo -archs build/${{ matrix.artifact_name }} | grep -q arm64
            # Both slices must target macOS 11, not the runner's OS version.
            for arch in arm64 x86_64; do
              otool -arch "$arch" -l build/${{ matrix.artifact_name }} \
                | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' > "target-$arch.txt"
              grep -E 'minos|version' "target-$arch.txt" || true
              grep -qE '(minos|version) 11\.' "target-$arch.txt" \
                || { echo "wrong deployment target for $arch"; exit 1; }
            done
          fi

      - name: Stage artifact
        run: |
          mkdir -p out
          cp build/${{ matrix.artifact_name }} out/${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # install.sh downloads checksums.txt from the release and refuses to
      # install a binary whose SHA-256 does not match.
      - name: Generate checksums.txt
        run: |
          cd artifacts
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Publish the Windows build to the Windows Package Manager (winget) by opening
  # a manifest PR against microsoft/winget-pkgs. Skips prereleases (tags with a
  # '-'). Only the Windows binary is a winget (portable) installer, so the regex
  # matches just that asset. The package version is the tag with its leading
  # 'v' stripped. Two repo secrets:
  #   WINGET_TOKEN           classic PAT, scope public_repo only, on the account
  #                          that forked microsoft/winget-pkgs; komac needs a
  #                          classic token to open the PR upstream.
  #   WINGET_FORK_SYNC_TOKEN fine-grained PAT, no expiration, restricted to
  #                          gistrec/winget-pkgs with Contents: write and
  #                          Workflows: write; used only by the fork-sync step.
  winget:
    needs: release
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      # komac creates its PR branch in the fork at upstream's HEAD. When that
      # brings in .github/workflows/* changes the fork has not seen yet (upstream
      # edits its workflows every few weeks, and the fork only moves at release
      # time), GitHub refuses the ref update unless the token may write workflow
      # files, and WINGET_TOKEN deliberately may not. So sync the fork's master
      # first via the fork-sync REST endpoint, with a token that is allowed to
      # but only on that one repo. winget-releaser@v2 predates komac's
      # `sync-fork` step, hence the explicit call. The JSON reply is logged; if
      # the job ever fails here, a re-run repeats the sync.
      - name: Sync winget-pkgs fork with upstream
        env:
          GH_TOKEN: ${{ secrets.WINGET_FORK_SYNC_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo '::error::WINGET_FORK_SYNC_TOKEN secret is missing'; exit 1; }
          gh api -X POST repos/gistrec/winget-pkgs/merge-upstream -f branch=master

      - name: Submit manifest to winget-pkgs
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: gistrec.filecast
          installers-regex: 'windows-x86_64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
